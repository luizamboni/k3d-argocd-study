# Values for the web-app-umbrella chart.
# Everything under `web-app` is passed directly to the dependent web-app chart.
web-app:
  image:
    repository: wiremock/wiremock
    tag: "3.8.0"
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    className: "traefik"
    annotations:
      ingress.kubernetes.io/ssl-redirect: "false"
    hosts:
      - host: localhost
        paths:
          - path: /umbrella/
            pathType: Prefix
    tls: []
  wiremock:
    storageMode: configMap
  mappings:
    hello-get.json: |
      {
        "request": {
          "method": "GET",
          "urlPath": "/umbrella/hello"
        },
        "response": {
          "status": 200,
          "headers": {
            "Content-Type": "application/json"
          },
          "jsonBody": { "message": "Hello from WireMock umbrella!" }
        }
      }
